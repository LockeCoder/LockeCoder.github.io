
name: Organize Travlr source folders

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-travlr-main
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Verify and organize Travlr folders
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/travlr/enhanced"
          admin="$root/travlr-admin"
          backend="$root/travlr-express"
          inner="$backend/travlr-express"

          # Verify the existing layout before making changes.
          [[ -d "$root" && ! -e "$admin" ]] || { echo 'Unexpected Angular destination. Stopping.'; exit 1; }
          [[ -d "$inner" && -f "$inner/app.js" && -f "$inner/package.json" ]] || { echo 'Expected nested Express backend is missing. Stopping.'; exit 1; }
          [[ ! -e "$backend/app.js" && ! -e "$backend/package.json" ]] || { echo 'Express destination already populated. Stopping.'; exit 1; }

          for entry in public src README.md angular.json package.json package-lock.json tsconfig.app.json tsconfig.json tsconfig.spec.json; do
            [[ -e "$root/$entry" ]] || { echo "Missing expected Angular file: $entry. Stopping."; exit 1; }
          done

          while IFS= read -r -d '' path; do
            name="$(basename "$path")"
            [[ ! -e "$backend/$name" ]] || { echo "Express destination collision: $name. Stopping."; exit 1; }
          done < <(find "$inner" -mindepth 1 -maxdepth 1 -print0)

          # Relocate Angular files without changing their contents.
          mkdir "$admin"
          for entry in public src README.md angular.json package.json package-lock.json tsconfig.app.json tsconfig.json tsconfig.spec.json; do
            mv -- "$root/$entry" "$admin/$entry"
          done

          # Remove only the accidental extra Express directory level.
          while IFS= read -r -d '' path; do
            mv -- "$path" "$backend/"
          done < <(find "$inner" -mindepth 1 -maxdepth 1 -print0)
          rmdir "$inner"
          rm -f -- "$backend/.gitkeep"

          # Add an index for the two enhanced applications.
          cat > "$root/README.md" <<'EOF'
          # Travlr Getaways — CS 499 Enhanced Artifact

          The enhanced Travlr Getaways project includes two source-code applications:

          - [travlr-admin](./travlr-admin/) — Angular administration interface.
          - [travlr-express](./travlr-express/) — Express REST API, authentication, and MongoDB integration.

          The [original course artifact](../Original/CS465-travlr/) and [software engineering enhancement narrative](../CS499_Milestone_Two_Narrative.docx) are available alongside this directory.

          This repository contains project source code, not a hosted application. Full dependency installation, database configuration, and end-to-end testing must still be completed before production use.
          EOF

          # Check expected destinations before preparing the commit.
          [[ -f "$admin/angular.json" && -f "$admin/package.json" && -d "$admin/src" && -d "$admin/public" ]]
          [[ -f "$backend/app.js" && -f "$backend/package.json" && -d "$backend/app_api" && -d "$backend/app_server" ]]
          [[ ! -e "$inner" && ! -e "$root/angular.json" && ! -e "$backend/.gitkeep" ]]
          git add -A -- "$root"

          # Files are moved unchanged. Skip the blanket whitespace check,
          # which rejected formatting in the original Angular README.
          git diff --cached --stat

      - name: Commit folder cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Organize Travlr enhanced source folders'
          git push origin HEAD:main
