
name: Verify Travlr applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular:
    name: Angular build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/travlr/enhanced/travlr-admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: artifacts/travlr/enhanced/travlr-admin/package-lock.json

      - name: Install locked Angular dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Angular application
        run: npm run build

      - name: Run Angular unit tests
        run: npm test -- --watch=false

  express:
    name: Express tests and MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: artifacts/travlr/enhanced/travlr-express

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Express dependencies
        run: npm install --no-audit --no-fund

      - name: Run Express unit tests
        run: npm test

      - name: Exercise live API with temporary MongoDB
        shell: bash
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/travlr_ci
          ADMIN_NAME: CI Administrator
          ADMIN_EMAIL: ci-admin@example.invalid

        run: |
          set -euo pipefail

          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export ADMIN_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"

          # Create an administrator in the temporary test database.
          npm run setup:admin

          # Start Express and capture diagnostic logs.
          npm start > "$RUNNER_TEMP/travlr-express.log" 2>&1 &
          api_pid=$!

          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "Express server log:"; tail -n 80 "$RUNNER_TEMP/travlr-express.log"; fi; kill "$api_pid" 2>/dev/null || true' EXIT

          # Verify that the API starts successfully.
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/trips > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Express API did not become ready.'
            exit 1
          fi

          # Execute real HTTP requests against the temporary database.
          node <<'NODE'
          const assert = require('node:assert/strict');
          const root = 'http://127.0.0.1:3000/api';

          async function request(method, path, payload, token) {
            const headers = {};

            if (token) {
              headers.Authorization = `Bearer ${token}`;
            }

            if (payload !== undefined) {
              headers['Content-Type'] = 'application/json';
            }

            const response = await fetch(root + path, {
              method,
              headers,
              body: payload === undefined
                ? undefined
                : JSON.stringify(payload)
            });

            const responseText = await response.text();

            let body;

            try {
              body = responseText
                ? JSON.parse(responseText)
                : null;
            } catch {
              body = responseText;
            }

            return {
              status: response.status,
              body,
              headers: response.headers
            };
          }

          (async () => {
            // Verify public trip retrieval.
            const empty = await request('GET', '/trips');

            assert.equal(
              empty.status,
              200,
              'Public trip listing must return 200'
            );

            assert.ok(
              Array.isArray(empty.body),
              'Trip listing must be an array'
            );

            // Verify CORS configuration.
            assert.equal(
              empty.headers.get('access-control-allow-origin'),
              'http://localhost:4200'
            );

            const trip = {
              code: `CI${Date.now()}`,
              name: 'Automated Integration Test',
              length: '3 days',
              start: '2026-11-01',
              resort: 'Test Resort',
              perPerson: '500',
              image: 'ci-test.jpg',
              description: 'Temporary test record'
            };

            // Reject unauthorized writes.
            const unauthorized = await request(
              'POST',
              '/trips',
              trip
            );

            assert.equal(
              unauthorized.status,
              401,
              'Writes without JWT must be denied'
            );

            // Reject incorrect administrator credentials.
            const deniedLogin = await request(
              'POST',
              '/login',
              {
                email: process.env.ADMIN_EMAIL,
                password: 'wrong-password'
              }
            );

            assert.equal(
              deniedLogin.status,
              401,
              'Invalid login must be denied'
            );

            // Authenticate the temporary administrator.
            const login = await request(
              'POST',
              '/login',
              {
                email: process.env.ADMIN_EMAIL,
                password: process.env.ADMIN_PASSWORD
              }
            );

            assert.equal(
              login.status,
              200,
              'Provisioned administrator login must succeed'
            );

            assert.ok(
              login.body &&
              typeof login.body.token === 'string',
              'Login must return a JWT'
            );

            const token = login.body.token;

            // Create a trip.
            const created = await request(
              'POST',
              '/trips',
              trip,
              token
            );

            assert.equal(
              created.status,
              201,
              'Authenticated trip creation must succeed'
            );

            assert.equal(created.body.code, trip.code);

            // Read the newly created trip.
            const loaded = await request(
              'GET',
              `/trips/${trip.code}`
            );

            assert.equal(
              loaded.status,
              200,
              'New trip must be readable'
            );

            assert.equal(loaded.body.name, trip.name);

            // Update the trip.
            const updated = await request(
              'PUT',
              `/trips/${trip.code}`,
              {
                ...trip,
                name: 'Updated Integration Trip'
              },
              token
            );

            assert.equal(
              updated.status,
              200,
              'Authenticated trip update must succeed'
            );

            assert.equal(
              updated.body.name,
              'Updated Integration Trip'
            );

            // Delete the trip.
            const deleted = await request(
              'DELETE',
              `/trips/${trip.code}`,
              undefined,
              token
            );

            assert.equal(
              deleted.status,
              204,
              'Authenticated trip deletion must succeed'
            );

            // Confirm the deleted trip is gone.
            const missing = await request(
              'GET',
              `/trips/${trip.code}`
            );

            assert.equal(
              missing.status,
              404,
              'Deleted trip must not be found'
            );

            console.log(
              'Express API/MongoDB integration checks passed.'
            );
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
