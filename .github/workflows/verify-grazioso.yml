
name: Verify Grazioso enhanced database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok"'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: artifacts/grazioso/enhanced
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Python and notebook syntax
        working-directory: artifacts/grazioso/enhanced
        run: |
          python -m compileall -q CRUD_Python_Module.py rescue_filters.py dashboard_app.py
          python - <<'PY'
          import json
          import ast
          with open('ProjectTwoDashboard.ipynb', encoding='utf-8') as f:
              notebook = json.load(f)
          for cell in notebook['cells']:
              if cell['cell_type'] == 'code':
                  ast.parse(''.join(cell['source']))
          print('Python modules and notebook parsed successfully')
          PY

      - name: Run unit and MongoDB integration tests
        working-directory: artifacts/grazioso/enhanced
        run: python -m pytest -q tests
