
name: Verify Grazioso enhanced database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: artifacts/grazioso/enhanced
        run: python -m pip install -r requirements-dev.txt

      - name: Wait for MongoDB readiness
        shell: bash
        run: |
          python - <<'PY'
          import os
          import time
          from pymongo import MongoClient
          from pymongo.errors import PyMongoError

          uri = os.environ["TEST_MONGO_URI"]

          for attempt in range(1, 31):
              try:
                  client = MongoClient(
                      uri,
                      serverSelectionTimeoutMS=1500
                  )
                  client.admin.command("ping")
                  client.close()
                  print("MongoDB is ready.")
                  break
              except PyMongoError:
                  print(f"Waiting for MongoDB ({attempt}/30)")
                  time.sleep(2)
          else:
              raise SystemExit("MongoDB did not become ready.")
          PY

      - name: Validate Python and notebook syntax
        working-directory: artifacts/grazioso/enhanced
        run: |
          python -m compileall -q \
            CRUD_Python_Module.py \
            rescue_filters.py \
            dashboard_app.py

          python - <<'PY'
          import json
          import ast

          with open(
              "ProjectTwoDashboard.ipynb",
              encoding="utf-8"
          ) as file:
              notebook = json.load(file)

          for cell in notebook["cells"]:
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]))

          print("Python and notebook syntax checks passed.")
          PY

      - name: Run unit and MongoDB integration tests
        working-directory: artifacts/grazioso/enhanced
        run: python -m pytest -q tests
