
name: Fix ABCU folder organization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Consolidate ABCU folders
        shell: bash
        run: |
          set -euo pipefail

          old="artifacts/abcu "
          new="artifacts/abcu"

          # Verify files before moving anything.
          test -f "$old/Original/ProjectTwo.cpp"
          test -f "$old/ enhanced/ProjectTwo.cpp"
          test -f "$old/README.md"
          test -f "$new/4-2 Milestone Three.docx"

          # Prevent overwriting existing destination files.
          test ! -e "$new/Original"
          test ! -e "$new/enhanced"
          test ! -e "$new/README.md"

          # Preserve the narrative and move existing source files.
          git mv "$old/Original" "$new/Original"
          git mv "$old/ enhanced" "$new/enhanced"
          git mv "$old/README.md" "$new/README.md"

          # Remove the unnecessary placeholder.
          # Force removal because the moved file is already staged.
          if test -f "$new/enhanced/.gitkeep"; then
            git rm -f -- "$new/enhanced/.gitkeep"
          fi

          # Verify the completed structure.
          test -f "$new/Original/ProjectTwo.cpp"
          test -f "$new/enhanced/ProjectTwo.cpp"
          test -f "$new/Original/CS 300 ABCU_Advising_Program_Input.csv"
          test -f "$new/enhanced/CS 300 ABCU_Advising_Program_Input.csv"
          test -f "$new/Original/README.md"
          test -f "$new/enhanced/README.md"
          test -f "$new/4-2 Milestone Three.docx"
          test -f "$new/README.md"

          # Remove the old directory only if it is empty.
          # rmdir refuses to delete directories containing files.
          if test -d "$old"; then
            rmdir -- "$old"
          fi

          # Confirm the incorrectly named directory is gone.
          test ! -d "$old"

          # Confirm the corrected structure is preserved.
          test -d "$new/Original"
          test -d "$new/enhanced"
          test ! -e "$new/enhanced/.gitkeep"

          # Check staged changes for whitespace errors.
          git diff --cached --check

          # Commit the folder organization changes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Consolidate ABCU artifact folders"
          git push origin HEAD:main
